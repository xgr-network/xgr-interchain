name: Audit supplemental evidence 2026-11-06
on:
  pull_request:
    paths: [.github/workflows/audit-20261106-supplement.yml]
permissions:
  contents: read
jobs:
  evidence:
    if: github.head_ref == 'audit/2026-11-06-delta-v3.3.0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: xita_ci
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: xita_sponsor_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U xita_ci -d xita_sponsor_ci"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - name: Pinned public source and test-only dependencies
        run: |
          set -euo pipefail
          git clone --single-branch --branch main https://github.com/xgr-network/xgr-interchain.git source
          git -C source checkout --detach 33a4e37cf48c509b83c67d8007c246ff2838c606
          npm install --prefix source/services/managed-relay --ignore-scripts --no-audit --no-fund --package-lock=false
          mkdir evidence
      - name: Test actual restricted database roles
        env:
          XITA_SPONSOR_TEST_DATABASE_URL: postgresql://xita_ci:local-ci-only@127.0.0.1:5432/xita_sponsor_ci
        run: |
          set -euo pipefail
          cd source
          cat > audit-roles.cjs <<'JS'
          const fs=require('fs'),assert=require('assert/strict'),{pathToFileURL}=require('url');
          const {Pool}=require('./services/managed-relay/node_modules/pg');
          (async()=>{
           const connectionString=process.env.XITA_SPONSOR_TEST_DATABASE_URL;
           assert.equal(new URL(connectionString).hostname,'127.0.0.1');
           const db=new Pool({connectionString}); const notes=[];
           const sql=n=>fs.readFileSync('services/indexer/sql/'+n,'utf8');
           for(const role of ['xita_tax_quote_writer','xita_sponsor_status_reader','xita_unrelated_reader'])await db.query('CREATE ROLE '+role+' LOGIN NOSUPERUSER NOBYPASSRLS NOREPLICATION');
           for(const file of ['002_transfer_operations.sql','003_interchain_journey.sql','004_sponsor_grants.sql','009_initial_fee_tax_evidence.sql','010_wallet_aware_sponsor_commitments.sql','012_sponsor_quote_finalized_resolution.sql','013_sponsor_prepared_tx.sql','014_sponsor_overtaken_obligations.sql','015_sponsor_spendable_receipt.sql'])await db.query(sql(file));
           await db.query('GRANT USAGE ON SCHEMA public TO xita_sponsor_status_reader');
           await db.query('GRANT SELECT ON xita_sponsor_grants,xita_transfer_operations TO xita_sponsor_status_reader');
           const {inspectSponsorObligations}=await import(pathToFileURL(process.cwd()+'/services/managed-relay/sponsor-obligation-audit.mjs'));
           const client=await db.connect();
           await client.query('SET ROLE xita_sponsor_status_reader');
           const result=await inspectSponsorObligations({pool:client,sponsorAddress:'0x'+'12'.repeat(20)});
           notes.push({test:'actual restricted monitor queries',result:result.status});
           await assert.rejects(client.query('DELETE FROM xita_sponsor_overtaken_obligations'),e=>e.code==='42501');
           await client.query('RESET ROLE');
           const source=fs.readFileSync('services/managed-relay/server.mjs','utf8');
           const readiness=source.match(/pool\.query\(`(SELECT\s+current_user LIKE[\s\S]+?)`\)/)[1];
           await client.query('SET ROLE xita_tax_quote_writer');
           assert.equal((await client.query(readiness)).rows[0].intent_read,false);
           await client.query('RESET ROLE');
           const repair=sql('011_quote_writer_runtime_grants.sql').replace(/:'writer_role'/g,"'xita_tax_quote_writer'");
           await client.query(repair);
           await client.query('SET ROLE xita_tax_quote_writer');
           const ready=(await client.query(readiness)).rows[0];
           assert.ok(Object.values(ready).every(v=>v===true));
           await client.query('SELECT i.quote_nonce,c.promised_wei FROM xita_sponsor_quote_intents i JOIN xita_sponsor_quote_commitments c USING(source_chain,execution_adapter,payer,quote_nonce) LIMIT 1');
           for(const table of ['xita_sponsor_quote_intents','xita_sponsor_quote_commitments','xita_sponsor_quote_resolutions','xita_sponsor_overtaken_obligations']){
            for(const privilege of ['UPDATE','DELETE'])assert.equal((await client.query('SELECT has_table_privilege(current_user,$1,$2) AS allowed',[table,privilege])).rows[0].allowed,false);
           }
           notes.push({test:'exact production readiness SQL after migration',checks:ready,forbiddenDebtMutations:false});
           await client.query('RESET ROLE');
           await assert.rejects(client.query(sql('011_quote_writer_runtime_grants.sql').replace(/:'writer_role'/g,"'xita_unrelated_reader'")),/no tax evidence INSERT grant/);
           await client.query('ROLLBACK');
           notes.push({test:'unrelated role promotion rejected',passed:true});
           client.release();await db.end();
           fs.writeFileSync('../evidence/restricted-roles.json',JSON.stringify({target:'33a4e37cf48c509b83c67d8007c246ff2838c606',utc:new Date().toISOString(),notes},null,2));
           console.log(JSON.stringify(notes,null,2));
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
          node audit-roles.cjs 2>&1 | tee ../evidence/restricted-roles.log
      - name: Read-only deployment and consensus-state observations
        if: always()
        run: |
          cd source
          cat > audit-readonly.cjs <<'JS'
          const fs=require('fs'),path=require('path'),crypto=require('crypto');
          const {keccak256}=require('./services/managed-relay/node_modules/ethers');
          const allowed=new Set(['eth_chainId','eth_blockNumber','eth_getCode','eth_getTransactionReceipt','eth_getBlockByNumber','eth_getStorageAt','web3_clientVersion']);
          let id=0;async function rpc(url,method,params=[]){
           if(!allowed.has(method)||!url.startsWith('https://'))throw Error('read-only RPC allowlist');
           const response=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:++id,method,params}),signal:AbortSignal.timeout(8000)});
           if(!response.ok)throw Error('HTTP '+response.status);const result=await response.json();if(result.error)throw Error(JSON.stringify(result.error));return result.result;
          }
          function walk(dir){return fs.readdirSync(dir,{withFileTypes:true}).flatMap(x=>x.isDirectory()?walk(path.join(dir,x.name)):[path.join(dir,x.name)]);}
          const names=['xgrchain','base','arbitrum','bsc','optimism'];
          const configs=Object.fromEntries(names.map(n=>[n,JSON.parse(fs.readFileSync('config/chains/'+n+'/chain.json'))]));
          const receipts=walk('deployments/receipts').filter(p=>p.endsWith('.json')).map(p=>({path:p,...JSON.parse(fs.readFileSync(p))})).filter(r=>names.includes(r.chain)&&r.runtimeCodeKeccak256&&r.transactionHash&&r.address);
          const tasks=receipts.flatMap(r=>configs[r.chain].rpcUrls.slice(0,2).map(url=>({r,url})));
          const out=[];let cursor=0;
          async function worker(){while(cursor<tasks.length){const {r,url}=tasks[cursor++];const row={receipt:r.path,chain:r.chain,address:r.address,rpc:url};try{
           const [chain,code,tx,canonical]=await Promise.all([rpc(url,'eth_chainId'),rpc(url,'eth_getCode',[r.address,'latest']),rpc(url,'eth_getTransactionReceipt',[r.transactionHash]),rpc(url,'eth_getBlockByNumber',['0x'+BigInt(r.blockNumber).toString(16),false])]);
           row.checks={chain:Number(BigInt(chain))===Number(r.chainId),runtime:keccak256(code).toLowerCase()===r.runtimeCodeKeccak256.toLowerCase(),receipt:!!tx&&tx.status==='0x1'&&tx.blockHash?.toLowerCase()===r.blockHash?.toLowerCase(),canonical:!!canonical&&canonical.hash?.toLowerCase()===r.blockHash?.toLowerCase()};
           row.status=Object.values(row.checks).every(Boolean)?'verified':'mismatch';
          }catch(e){row.status='unavailable';row.error=String(e.message).slice(0,220)}out.push(row);}}
          (async()=>{
           await Promise.all(Array.from({length:8},worker));
           const heads=[];for(const name of names)for(const url of configs[name].rpcUrls.slice(0,2)){try{
            const tag=name==='bsc'?'finalized':['base','arbitrum','optimism'].includes(name)?'safe':'latest';
            const block=await rpc(url,'eth_getBlockByNumber',[tag,false]);heads.push({chain:name,rpc:url,tag,number:block?.number,hash:block?.hash});
           }catch(e){heads.push({chain:name,rpc:url,error:String(e.message)})}}
           const node=[];for(const url of configs.xgrchain.rpcUrls.slice(0,2)){try{
            const address='0x'+'1001'.padStart(40,'0');const [client,code,marker]=await Promise.all([rpc(url,'web3_clientVersion'),rpc(url,'eth_getCode',[address,'latest']),rpc(url,'eth_getStorageAt',[address,'0xd','latest'])]);
            const blocks=[];for(const h of [12586648,12586649,12587000]){const b=await rpc(url,'eth_getBlockByNumber',['0x'+h.toString(16),false]);blocks.push({number:h,hash:b?.hash,stateRoot:b?.stateRoot});}
            node.push({rpc:url,client,runtimeBytes:(code.length-2)/2,runtimeSha256:crypto.createHash('sha256').update(Buffer.from(code.slice(2),'hex')).digest('hex'),migrationMarker:marker,blocks});
           }catch(e){node.push({rpc:url,error:String(e.message)})}}
           const result={utc:new Date().toISOString(),source:'33a4e37cf48c509b83c67d8007c246ff2838c606',readOnly:true,providerIndependenceNotProven:true,receiptCount:receipts.length,checks:out,heads,node};
           fs.writeFileSync('../evidence/read-only-deployments.json',JSON.stringify(result,null,2));
           console.log(JSON.stringify({receipts:receipts.length,checks:out.length,verified:out.filter(x=>x.status==='verified').length,mismatch:out.filter(x=>x.status==='mismatch'),unavailable:out.filter(x=>x.status==='unavailable').length,node},null,2));
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
          node audit-readonly.cjs 2>&1 | tee ../evidence/read-only-deployments.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: audit-supplemental-evidence
          path: evidence/
          retention-days: 7
  node-repeat:
    if: github.head_ref == 'audit/2026-11-06-delta-v3.3.0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: go1.23.11
      GOMAXPROCS: '2'
    steps:
      - name: Repeat scoped JSON-RPC and Direct-BLS recovery regressions
        run: |
          set -euo pipefail
          git clone --single-branch --branch XGR3.0 https://github.com/xgr-network/xgr-node.git source
          git -C source checkout --detach a84c82737dc3ca195192a96498eab0e170f8bb5a
          mkdir evidence
          cd source
          go test -p 2 -count=3 -timeout=5m ./jsonrpc ./interchain/runtime ./consensus/ibft/blspop 2>&1 | tee ../evidence/node-repeat.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: audit-node-repeat-evidence
          path: evidence/
          retention-days: 7
