name: Publish verified audit record 2026-11-06
on:
  pull_request:
    paths: [.github/workflows/audit-20261106-publish.yml]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    if: github.head_ref == 'audit/2026-11-06-delta-v3.3.0' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify exact reviewed artifact and publish audit-only files
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,io,json,os,pathlib,shutil,subprocess,urllib.request,urllib.error,zipfile
          out=pathlib.Path('audits/2026-11-06-xita-direct-bls-delta-v3.3.0')
          validation=json.loads((out/'publication-validation.json').read_text())
          assert validation['reviewed_artifact_id']==13490706890
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):return None
          request=urllib.request.Request('https://api.github.com/repos/xgr-network/xgr-interchain/actions/artifacts/13490706890/zip',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'xgr-audit-publication'})
          try:
              with urllib.request.build_opener(NoRedirect).open(request,timeout=60) as r:raw=r.read()
          except urllib.error.HTTPError as e:
              if e.code not in (301,302,303,307,308):raise
              location=e.headers['Location'];assert location.startswith('https://')
              with urllib.request.urlopen(location,timeout=90) as r:raw=r.read()
          assert hashlib.sha256(raw).hexdigest()==validation['reviewed_artifact_sha256']
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              for entry in z.infolist():
                  p=pathlib.PurePosixPath(entry.filename)
                  assert not p.is_absolute() and '..' not in p.parts
                  if entry.is_dir():continue
                  assert entry.file_size<5_000_000
                  target=out/str(p);target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(z.read(entry))
          subprocess.run(['python3',str(out/'verify_artifacts.py')],check=True)
          for item in validation['pdfs']:
              assert hashlib.sha256((out/item['path']).read_bytes()).hexdigest()==item['sha256']
          workflow_names=['audit-20261106.yml','audit-20261106-supplement.yml','audit-20261106-reports.yml','audit-20261106-publish.yml']
          archive=out/'evidence/workflows';archive.mkdir(parents=True,exist_ok=True)
          for name in workflow_names:shutil.copyfile(pathlib.Path('.github/workflows')/name,archive/name)
          publication={'audit_id':validation['audit_id'],'verified_input_artifact':13490706890,'verified_input_sha256':validation['reviewed_artifact_sha256'],'publication_parent':os.environ['EXPECTED_HEAD'],'pdfs':validation['pdfs'],'temporary_workflows':'Archived as evidence and removed from active CI; final PR changes audit paths only.','operational_changes':'None. No product code, live service, transaction, deployment or production configuration changed.','later_attestation':'publication-readback.json is intentionally outside the byte manifest because it records the resulting publication commit.'}
          (out/'publication-record.json').write_text(json.dumps(publication,indent=2)+'\n')
          with zipfile.ZipFile(out/'evidence-public.zip','w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in sorted((out/'evidence').rglob('*')):
                  if not p.is_file():continue
                  info=zipfile.ZipInfo(p.relative_to(out).as_posix(),(2026,11,6,9,0,0));info.compress_type=zipfile.ZIP_DEFLATED;info.external_attr=0o100644<<16;z.writestr(info,p.read_bytes())
          manifest={'audit_id':validation['audit_id'],'sources':{'xgr-interchain':'33a4e37cf48c509b83c67d8007c246ff2838c606','xgr-node':'a84c82737dc3ca195192a96498eab0e170f8bb5a'},'exclusions':['archive-manifest.json','publication-readback.json'],'files':[]}
          for p in sorted(out.rglob('*')):
              if p.is_file() and p.name not in manifest['exclusions']:
                  manifest['files'].append({'path':p.relative_to(out).as_posix(),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          (out/'archive-manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          subprocess.run(['python3',str(out/'verify_artifacts.py')],check=True)
          index=pathlib.Path('audits/README.md');text=index.read_text();assert text.count('## Current assessment')==1
          heading='''## Current assessment

          [**XITA-DBLS-2026-11-06-v3.3.0**](./2026-11-06-xita-direct-bls-delta-v3.3.0/): **CONDITIONAL GO for restricted self-funded core transfers; NO-GO for unrestricted unattended sponsorship; NO-GO for unattended Creator availability pending the demonstrated queue-isolation repair.** Staffed, bounded scopes have separate explicit conditions. See the [full English PDF](./2026-11-06-xita-direct-bls-delta-v3.3.0/report.pdf), [separate operating decisions](./2026-11-06-xita-direct-bls-delta-v3.3.0/launch-decision.md), and [XGR v3.5.0 possession companion review](./2026-11-06-xita-direct-bls-delta-v3.3.0/node-v3.5.0-review.pdf). Solana is excluded.

          Frozen sources: Interchain `33a4e37cf48c509b83c67d8007c246ff2838c606`; node `a84c82737dc3ca195192a96498eab0e170f8bb5a`. The 39-entry current register contains **0 Critical, 0 High, 11 Medium, 15 Low, 3 Informational and 10 resolved causes**. F-06/F-32/F-33 are newly verified resolved; F-04 is downgraded rather than closed; F-20 retains a narrower residual. F-36 through F-39 are new Creator findings. All 35 previous entries and 43 historical occurrences are reconciled. This is an AI-assisted source/execution review, not an accredited external certificate; zero Critical/High is not a guarantee of absence. Existing dated audits remain unchanged. Actual PDFs, public evidence and integrity manifests are included; unresolved executable Creator reproductions remain operator-confidential.

          ## Prior assessment (29 October 2026)
          '''
          heading='\n'.join(line[10:] if line.startswith('          ') else line for line in heading.splitlines())
          index.write_text(text.replace('## Current assessment',heading.strip(),1))
          for name in workflow_names:subprocess.run(['git','rm','--','.github/workflows/'+name],check=True)
          subprocess.run(['git','add','--',str(out),'audits/README.md'],check=True)
          changed=subprocess.check_output(['git','diff','--cached','--name-only','33a4e37cf48c509b83c67d8007c246ff2838c606'],text=True).splitlines()
          assert changed and all(p=='audits/README.md' or p.startswith(str(out)+'/') for p in changed),changed
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==os.environ['EXPECTED_HEAD']
          subprocess.run(['git','config','user.name','XGR Audit Evidence'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m','audit: publish verified 6 November reports, matrices and evidence; retire temporary workflows'],check=True)
          branch='audit/2026-11-06-delta-v3.3.0'
          subprocess.run(['git','push','--force-with-lease=refs/heads/'+branch+':'+os.environ['EXPECTED_HEAD'],'origin','HEAD:refs/heads/'+branch],check=True)
          print('Published commit:',subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: audit-published-final-record
          path: audits/2026-11-06-xita-direct-bls-delta-v3.3.0/
          retention-days: 30
