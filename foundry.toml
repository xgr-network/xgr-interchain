[profile.default]
src = "contracts"
test = "test"
out = "out"
libs = ["lib"]
remappings = [
    "@hyperlane-xyz/core/=vendor/node_modules/@hyperlane-xyz/core/",
    "@openzeppelin/contracts/=vendor/node_modules/@openzeppelin/contracts/",
    "@openzeppelin/contracts-upgradeable/=vendor/node_modules/@openzeppelin/contracts-upgradeable/"
]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200

via_ir = true
evm_version = "prague"
