[package]
name = "xita-bls-sbf-probe-tests"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dev-dependencies]
mollusk-svm = "=0.13.4"
solana-instruction = "=3.0.0"
