<!-- Sitewide fixed, procedural dust atlas. Independent of assets, route state and RPC. -->
<defs>
 <radialGradient id="band"><stop offset="0" stop-color="white" stop-opacity=".82"/><stop offset=".38" stop-color="white" stop-opacity=".48"/><stop offset=".73" stop-color="white" stop-opacity=".14"/><stop offset="1" stop-color="black"/></radialGradient>
 <radialGradient id="smoke"><stop offset="0" stop-color="#376183" stop-opacity=".21"/><stop offset=".42" stop-color="#254662" stop-opacity=".10"/><stop offset="1" stop-color="#162336" stop-opacity="0"/></radialGradient>
 <radialGradient id="dust2"><stop offset="0" stop-color="#514866" stop-opacity=".14"/><stop offset=".55" stop-color="#30425c" stop-opacity=".06"/><stop offset="1" stop-color="#1b263c" stop-opacity="0"/></radialGradient>
 <filter id="cloud" x="-10%" y="-10%" width="120%" height="120%">
  <feTurbulence type="fractalNoise" baseFrequency=".008 .025" numOctaves="4" seed="17" stitchTiles="stitch" result="n"/>
  <feColorMatrix in="n" type="matrix" values="0 0 0 0 .18 0 0 0 0 .34 0 0 0 0 .48 .75 .4 .2 0 -.63" result="alpha"/>
  <feGaussianBlur in="alpha" stdDeviation="3"/>
 </filter>
 <filter id="cloud-soft" x="-10%" y="-10%" width="120%" height="120%">
  <feTurbulence type="fractalNoise" baseFrequency=".005 .014" numOctaves="3" seed="38" result="n"/>
  <feColorMatrix in="n" type="matrix" values="0 0 0 0 .30 0 0 0 0 .29 0 0 0 0 .47 .70 .28 .35 0 -.58"/>
  <feGaussianBlur stdDeviation="9"/>
 </filter>
 <mask id="band-mask">
  <g transform="rotate(-17 800 480)"><ellipse cx="800" cy="485" rx="980" ry="225" fill="url(#band)"/></g>
 </mask>
</defs>
