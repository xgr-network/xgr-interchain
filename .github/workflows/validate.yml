name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sponsor-obligation-postgres:
    name: Sponsor obligations (real disposable PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: xita_ci
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: xita_sponsor_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xita_ci -d xita_sponsor_ci"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      XITA_SPONSOR_TEST_DATABASE_URL: postgresql://xita_ci:local-ci-only@127.0.0.1:5432/xita_sponsor_ci
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated managed relay test dependencies
        run: npm install --prefix services/managed-relay --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Run real PostgreSQL liability fault matrix
        run: |
          set -euo pipefail
          test -n "$XITA_SPONSOR_TEST_DATABASE_URL"
          node --test services/managed-relay/sponsor-obligation-audit.pg.test.mjs
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify executable website deployment entrypoint
        shell: bash
        run: |
          set -euo pipefail
          test -x ./manage.sh || { echo "manage.sh has lost its Git executable bit (expected 100755)" >&2; exit 1; }
          test "$(git ls-files --stage -- manage.sh | cut -d ' ' -f1)" = "100755"
          bash -n ./manage.sh

      - name: Assert no populated runtime secrets are tracked
        shell: bash
        run: |
          set -euo pipefail
          test ! -e runtime/.env.relayer
          test ! -e runtime/.env.relayer.reverse
          if git ls-files -- "runtime/.env.relayer.iln.*" | grep -vE "\.example$"; then
            echo "Real XETA ILN runtime env file committed" >&2
            exit 1
          fi
          if git grep -nE '(^|=)(0x)?[0-9a-fA-F]{64}$' -- runtime ':!runtime/*.example'; then
            echo "Potential raw private key found in tracked runtime files" >&2
            exit 1
          fi

      - name: Validate JSON manifests
        shell: bash
        run: |
          set -euo pipefail
          find config deployments -name "*.json" -print0 | xargs -0 -r -n1 jq empty
          jq empty runtime/native-relayer/package.json

      - name: Validate repository manifests and catalog snapshot
        shell: bash
        run: |
          set -euo pipefail
          node tools/validate-manifests.mjs
          node tools/build-xeta-web-catalog.mjs --check
          node --test apps/web/chain-finality.test.mjs runtime/native-relayer/source-finality.test.mjs
          node tools/check-hub-route-expansion.mjs
          node --test tools/auto-hub-routes.test.mjs

      - name: Install pinned creator verifier
        run: npm install --prefix services/onboarding --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Validate manifest and onboarding generation tests
        shell: bash
        run: |
          set -euo pipefail
          node --test services/onboarding/creator-manifests.test.mjs services/onboarding/creator-chain-proof.test.mjs tools/optimism-predeploy.test.mjs tools/manifest-layout.test.mjs tools/validate-manifests.test.mjs services/onboarding/manifests.test.mjs apps/web/token-slug.test.mjs apps/web/join.test.mjs services/onboarding/coingecko-identity.test.mjs services/onboarding/private-store.test.mjs services/onboarding/status-notifier.test.mjs services/onboarding/status-notifier.integration.test.mjs services/onboarding/server.test.mjs services/onboarding/creator-logo-png.test.mjs services/onboarding/creator-registration.test.mjs tools/join-nginx.test.mjs tools/validate-join-pr.test.mjs

      - name: Validate read-only mainnet roundtrip audit
        run: node --test tools/verify-xita-roundtrip.test.mjs

      - name: Validate Base archive RPC qualification logic
        run: node --test tools/probe-base-rpc.test.mjs

      - name: Public Chainlist Base archive diagnostics
        continue-on-error: true
        run: node tools/probe-base-rpc.mjs

      - name: Prevent accidental XITA website rollback
        run: node --test tools/stamp-xita-web-modules.test.mjs tools/stamp-xita-web-style.test.mjs tools/manage-web-release.test.mjs tools/quote-db-role.test.mjs tools/verify-iln-route-catalog.test.mjs

      - name: Validate read-only transfer Nginx install and repair
        run: node --test tools/transfer-recovery-nginx.test.mjs
      - name: Validate global XITA Interchain Fee ingress
        run: node --test tools/interchain-fee-nginx.test.mjs

      - name: Validate persisted wallet TX announcement intake
        run: node --test services/indexer/transfer-intake.test.mjs services/indexer/transfer-announcements.test.mjs tools/transfer-intake-nginx.test.mjs
      - name: Validate indexer metrics server
        run: node --test services/indexer/server.test.mjs
      - name: Validate token-agnostic TVL and 24h escrow gross volume
        run: node --test services/indexer/tvl-verifier.test.mjs services/indexer/escrow-flow-24h.test.mjs

      - name: Install read-only indexer dependencies for live route audit
        run: npm install --prefix services/indexer --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Validate unsigned on-chain destination recovery
        run: node --test services/indexer/route-readiness.test.mjs services/indexer/transfer-recovery.test.mjs services/indexer/transfer-proof-observer.test.mjs services/indexer/xgr-quorum-poll.test.mjs services/indexer/transfer-index.test.mjs services/indexer/explorer-wallet-discovery.test.mjs services/indexer/transfer-index-store.test.mjs

      - name: Validate indexed on-chain wallet worklist (generic route identities)
        run: node --test services/indexer/transfer-index-store.test.mjs

      - name: Install isolated optional managed relay signer dependencies
        run: npm install --prefix services/managed-relay --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Validate optional managed relay quotes and source-native fees
        run: node --test services/managed-relay/*.test.mjs

      - name: Validate CoinGecko adapter
        run: node --test services/indexer/coingecko.test.mjs

      - name: Validate finalized route observer
        run: node --test services/indexer/finality-observer.test.mjs

      - name: Validate derived publication policy
        run: node --test services/indexer/publication.test.mjs

      - name: Validate UI and discovery tests
        shell: bash
        run: |
          set -euo pipefail
          node --test apps/web/token-creator.test.mjs apps/web/legal.test.mjs apps/web/keccak.test.mjs apps/web/wallet-core.test.mjs apps/web/wallet-gas.test.mjs apps/web/wallet-transfers.test.mjs apps/web/wallet-pending.test.mjs apps/web/source-tx-hints.test.mjs apps/web/wallet-transfer-selection.test.mjs apps/web/transfer-flow-binding.test.mjs apps/web/verified-journey.test.mjs apps/web/wallet-index-projection.test.mjs apps/web/transfer-status-flow.test.mjs apps/web/transfer-step-timer.test.mjs apps/web/transfer-token-journey.test.mjs apps/web/transfer-balance-refresh.test.mjs apps/web/transfer-actions.test.mjs apps/web/wallet-nonce.test.mjs apps/web/transfer-page.test.mjs apps/web/experience.test.mjs apps/web/universe-orbits.test.mjs apps/web/universe-token-layout.test.mjs apps/web/system-rankings.test.mjs apps/web/universe-scene.test.mjs apps/web/token-representation.test.mjs apps/web/leaderboard-data.test.mjs apps/web/listing-visibility.test.mjs

      - name: Validate shell and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n runtime/manage-relayers.sh
          bash runtime/manage-relayers.sh status all
          if bash runtime/manage-relayers.sh status iln-invalid; then
            echo "Invalid ILN route target was accepted" >&2
            exit 1
          fi
          node tools/check-xeta-clean.mjs
          find runtime/native-relayer -maxdepth 1 -name '*.mjs' -print0 | xargs -0 -n1 node --check
          find apps/web -maxdepth 1 \( -name '*.mjs' -o -name '*.js' \) -print0 | xargs -0 -n1 node --check

      - name: Validate operator admin
        shell: bash
        run: |
          set -euo pipefail
          find services/admin -maxdepth 1 -name '*.mjs' -print0 | xargs -0 -n1 node --check
          node --check services/onboarding/server.mjs
          node --check services/onboarding/manifests.mjs
          node --check services/admin/admin.js
          node --check services/admin/wallet.js
          grep -q 'type="module" src="/admin/admin.js"' services/admin/index.html
          node --test services/admin/*.test.mjs

      - name: Native relayer tests
        shell: bash
        run: |
          set -euo pipefail
          cd runtime/native-relayer
          npm install --no-audit --no-fund
          npm test

      - name: Use preinstalled runner Chromium for smoke and screenshot tests
        shell: bash
        run: |
          set -euo pipefail
          for browser in google-chrome chromium chromium-browser google-chrome-stable; do
            if command -v "$browser" >/dev/null 2>&1; then
              resolved="$(command -v "$browser")"
              "$resolved" --version
              echo "XITA_BROWSER=$resolved" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "GitHub runner has no Chrome/Chromium; browser checks cannot run" >&2
          exit 1

      - name: Browser startup smoke test
        shell: bash
        run: |
          set -euo pipefail
          node --test apps/web/browser-smoke.test.mjs

      - name: Capture actual WebGL Universe
        shell: bash
        run: |
          mkdir -p artifacts
          node apps/web/render-visual-snapshot.mjs artifacts/universe.png

      - name: Publish 3D Universe review image
        uses: actions/upload-artifact@v4
        with:
          name: xita-universe-3d-preview
          path: artifacts/universe.png
          if-no-files-found: error

