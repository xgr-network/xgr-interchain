name: Publish PR419 closure addendum
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/audit-pr419-closure.yml'
permissions:
  contents: read
concurrency:
  group: pr419-audit-publication
  cancel-in-progress: false
jobs:
  assemble-audit-only:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'audit/xita-v1-pr419-closure-v3.4.1-20261115' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      AUDIT_BRANCH: audit/xita-v1-pr419-closure-v3.4.1-20261115
      AUDIT_DIR: audits/2026-11-15-xita-v1-closure-v3.4.1
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Verify exact evidence archive and preserve collection recipe
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          mkdir -p .audit-input "$AUDIT_DIR/evidence/collector-workflows"
          gh api /repos/xgr-network/xgr-interchain/actions/artifacts/14170887571/zip > .audit-input.zip
          echo 'b14d28195128cef8fb97445f430f746ea260b27057328951ca6a13365fd9c1fb  .audit-input.zip' | sha256sum -c -
          python - <<'PY'
          from pathlib import Path
          import zipfile
          with zipfile.ZipFile('.audit-input.zip') as archive:
              for name in archive.namelist():
                  assert not name.startswith('/') and '..' not in Path(name).parts, name
              archive.extractall('.audit-input')
          PY
          git show 9a0abde694103901c19bde64a7eb99a0dcedd64e:.github/workflows/audit-pr419-closure.yml > "$AUDIT_DIR/evidence/collector-workflows/final-collector.yml"
          cp .github/workflows/audit-pr419-closure.yml "$AUDIT_DIR/evidence/collector-workflows/publication.yml"
      - name: Render authored report and verify previously reviewed PDF bytes
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet reportlab==4.4.9
          python "$AUDIT_DIR/build_reports.py" --evidence .audit-input
          echo "14b2cbac52e1f92a87323683bc8f94839d87f1c0ef0566910555fc13ca3e3dfc  $AUDIT_DIR/report.pdf" | sha256sum -c -
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['AUDIT_DIR'])
          manifest=json.loads((root/'archive-manifest.json').read_text())
          for entry in manifest['files']:
              data=(root/entry['path']).read_bytes()
              assert len(data)==entry['size']
              assert hashlib.sha256(data).hexdigest()==entry['sha256'],entry['path']
          print('Verified public manifest files:',len(manifest['files']))
          PY
      - name: Commit only new dated audit files to authorized branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$AUDIT_BRANCH" | cut -f1)" = "$EXPECTED_HEAD"
          git add -- "$AUDIT_DIR"
          if git diff --cached --name-only | grep -v '^audits/2026-11-15-xita-v1-closure-v3.4.1/'; then
            echo 'Unexpected non-audit staged path' >&2
            exit 1
          fi
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'audit: publish verified PR419 closure PDF, status and retained evidence'
          git push origin "HEAD:refs/heads/$AUDIT_BRANCH"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: xita-pr419-closure-v3.4.1-publication
          path: audits/2026-11-15-xita-v1-closure-v3.4.1/
          retention-days: 30
          if-no-files-found: error
