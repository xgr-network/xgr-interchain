name: Audit PR419 closure evidence
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/audit-pr419-closure.yml'
permissions:
  contents: read
jobs:
  frozen-source-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: xita_ci
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: xita_closure_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U xita_ci -d xita_closure_ci"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      XITA_SPONSOR_TEST_DATABASE_URL: postgresql://xita_ci:local-ci-only@127.0.0.1:5432/xita_closure_ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 6e78cadc631fcdff8605ea0428965e7b911076cd
          fetch-depth: 0
          persist-credentials: false
      - name: Freeze source and compare actual deployed report targets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p closure-evidence/logs
          test "$(git rev-parse HEAD)" = 6e78cadc631fcdff8605ea0428965e7b911076cd
          git rev-parse HEAD HEAD^{tree} > closure-evidence/revision.txt
          git ls-tree -r HEAD > closure-evidence/tree.txt
          git archive --format=tar.gz --prefix=interchain/ HEAD > closure-evidence/source.tar.gz
          git diff --name-status 233d1b357e1f949ea79647e9b0a852787f2a7e0e HEAD > closure-evidence/changed-paths.txt
          git diff --binary 233d1b357e1f949ea79647e9b0a852787f2a7e0e HEAD > closure-evidence/pr419.patch
          test -z "$(git diff --name-only 233d1b357e1f949ea79647e9b0a852787f2a7e0e HEAD -- contracts/ config/ deployments/ apps/web/)"
          date -u +'%Y-%m-%dT%H:%M:%SZ' > closure-evidence/collected-at.txt
          node --version > closure-evidence/toolchain.txt
          npm --version >> closure-evidence/toolchain.txt
          for dir in services/onboarding services/managed-relay services/indexer; do
            npm install --prefix "$dir" --ignore-scripts --no-audit --no-fund --package-lock=false
          done
          tar -czf closure-evidence/dependencies.tar.gz services/onboarding/node_modules services/managed-relay/node_modules services/indexer/node_modules
      - name: Repeat all affected service regression files, retain each result
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          printf 'path\texit_code\n' > closure-evidence/results.tsv
          for path in services/onboarding/creator-registration.test.mjs services/onboarding/creator-manifests.test.mjs services/onboarding/creator-operator.test.mjs services/onboarding/private-store.test.mjs services/managed-relay/gas-sponsor.test.mjs services/managed-relay/gas-sponsor-f08-effects.test.mjs services/managed-relay/creator-wallet-guard.test.mjs services/managed-relay/sponsor-obligation-review.test.mjs services/managed-relay/sponsor-status.test.mjs services/managed-relay/sponsor-obligation-audit.test.mjs services/managed-relay/sponsor-obligation-audit.pg.test.mjs; do
            timeout 120s node --test --test-reporter=tap "$path" > "closure-evidence/logs/$(basename "$path").log" 2>&1
            rc=$?
            printf '%s\t%s\n' "$path" "$rc" | tee -a closure-evidence/results.tsv
            if [ "$rc" -ne 0 ]; then failed=$((failed+1)); fi
          done
          printf 'failed_files=%s\n' "$failed" > closure-evidence/summary.txt
          (cd closure-evidence && sha256sum source.tar.gz dependencies.tar.gz pr419.patch results.tsv > sha256sums.txt)
          test "$failed" -eq 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr419-closure-source-and-regression
          path: closure-evidence/
          retention-days: 14
          if-no-files-found: error
