name: Audit 2026-11-06 isolated evidence
on:
  pull_request:
    types: [opened, reopened]
    paths:
      - '.github/workflows/audit-20261106.yml'
permissions:
  contents: read
jobs:
  sources:
    if: github.head_ref == 'audit/2026-11-06-delta-v3.3.0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Export exact public snapshots and dependency versions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export
          git clone --quiet --single-branch --branch main https://github.com/xgr-network/xgr-interchain.git export/xgr-interchain
          git -C export/xgr-interchain checkout --detach 33a4e37cf48c509b83c67d8007c246ff2838c606
          git clone --quiet --single-branch --branch XGR3.0 https://github.com/xgr-network/xgr-node.git export/xgr-node
          git -C export/xgr-node checkout --detach a84c82737dc3ca195192a96498eab0e170f8bb5a
          for d in services/onboarding services/managed-relay services/indexer runtime/native-relayer; do
            (cd "export/xgr-interchain/$d"; if [ -f package-lock.json ]; then npm ci --ignore-scripts --no-audit --no-fund; else npm install --ignore-scripts --no-audit --no-fund --package-lock=false; fi; npm ls --all --json > audit-installed-dependencies.json || true)
          done
          git -C export/xgr-interchain rev-parse HEAD > export/interchain-sha.txt
          git -C export/xgr-node rev-parse HEAD > export/node-sha.txt
          tar -czf frozen-public-sources.tgz -C export .
          sha256sum frozen-public-sources.tgz > frozen-public-sources.tgz.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: audit-20261106-frozen-public-sources
          path: |
            frozen-public-sources.tgz
            frozen-public-sources.tgz.sha256
          retention-days: 30
  node-regression:
    if: github.head_ref == 'audit/2026-11-06-delta-v3.3.0'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Prepare exact node and cached build inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git clone --quiet --single-branch --branch XGR3.0 https://github.com/xgr-network/xgr-node.git node-source
          cd node-source
          git checkout --detach a84c82737dc3ca195192a96498eab0e170f8bb5a
          export GOTOOLCHAIN=go1.23.11
          go version | tee ../evidence/go-version.txt
          go mod download
          npm ci --prefix scripts/staking-pop-build --ignore-scripts --no-audit --no-fund
          git rev-parse HEAD > ../evidence/source-sha.txt
          go env GOMODCACHE GOCACHE GOPATH > ../evidence/go-paths.txt
      - name: Run existing v3.5.0 validation with loopback-only networking
        shell: bash
        run: |
          set +e
          sudo env PATH="$PATH" HOME="$HOME" GOTOOLCHAIN=go1.23.11 npm_config_offline=true unshare --net bash -c 'set -e; ip link set lo up; cd node-source; bash scripts/validate-v3.5.0.sh' > evidence/node-validation.log 2>&1
          result=$?
          printf '%s\n' "$result" > evidence/node-validation.exit
          tail -n 60 evidence/node-validation.log
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: audit-20261106-node-regression
          path: evidence/
          retention-days: 30
      - name: Preserve actual test outcome
        run: test "$(cat evidence/node-validation.exit)" = 0
  interchain-regression:
    if: github.head_ref == 'audit/2026-11-06-delta-v3.3.0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prepare exact public source and dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git clone --quiet --single-branch --branch main https://github.com/xgr-network/xgr-interchain.git source
          git -C source checkout --detach 33a4e37cf48c509b83c67d8007c246ff2838c606
          for d in services/onboarding services/managed-relay services/indexer runtime/native-relayer; do
            (cd "source/$d"; if [ -f package-lock.json ]; then npm ci --ignore-scripts --no-audit --no-fund; else npm install --ignore-scripts --no-audit --no-fund --package-lock=false; fi)
          done
          node --version > evidence/node-version.txt
          git -C source rev-parse HEAD > evidence/source-sha.txt
      - name: Run repository JavaScript regressions with loopback-only networking
        shell: bash
        run: |
          set +e
          sudo env PATH="$PATH" HOME="$HOME" unshare --net bash -c 'set -e; ip link set lo up; cd source; find apps/web services/admin services/onboarding services/indexer services/managed-relay runtime/native-relayer tools -maxdepth 1 -name "*.test.mjs" ! -name "browser-smoke.test.mjs" -print0 | sort -z | xargs -0 node --test --test-concurrency=4' > evidence/interchain-tests.log 2>&1
          result=$?
          printf '%s\n' "$result" > evidence/interchain-tests.exit
          tail -n 60 evidence/interchain-tests.log
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: audit-20261106-interchain-regression
          path: evidence/
          retention-days: 30
      - name: Preserve actual test outcome
        run: test "$(cat evidence/interchain-tests.exit)" = 0
