name: XITA Direct BLS Security Review
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  clean-reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Merkle-free security boundary and empty deployment catalog
        run: node tools/assert-xita-direct-clean.mjs
      - name: Verify signed receipt/deployment APIs use no historical state
        run: node --test services/admin/deployment-ledger.test.mjs
  solidity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Install dependencies
        run: |
          npm install --prefix vendor --ignore-scripts --no-audit --no-fund
          forge install foundry-rs/forge-std --no-commit
      - name: Direct BLS security and end-to-end Solidity tests
        run: forge test -vv
