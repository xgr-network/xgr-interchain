name: Solana BLS SBF / Mollusk feasibility (experimental)

on:
  pull_request:
    paths:
      - 'chains/solana/sbf-bench/**'
      - '.github/workflows/solana-bls-sbf.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  solana-bls-sbf:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install Agave 4.4.0 toolchain (local SBF only)
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://release.anza.xyz/v4.4.0/install -o /tmp/agave-install.sh
          installed=0
          for attempt in 1 2 3 4; do
            if sh /tmp/agave-install.sh; then
              installed=1
              break
            fi
            echo "Agave artifact/install attempt $attempt failed; retrying archive extraction"
            rm -rf "$HOME/.local/share/solana/install/releases/4.4.0"
            sleep "$((attempt * 3))"
          done
          test "$installed" -eq 1
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Verify tools
        run: |
          solana --version
          cargo build-sbf --version
      - name: Build native host tests
        run: cargo test --manifest-path chains/solana/sbf-bench/Cargo.toml -p xita-bls-sbf-probe --lib
      - name: Compile actual SBFv3 program
        working-directory: chains/solana/sbf-bench/program
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if cargo build-sbf --arch v3 > /tmp/xita-sbf-build.log 2>&1; then
              cat /tmp/xita-sbf-build.log
              break
            fi
            cat /tmp/xita-sbf-build.log
            if ! grep -Eq 'Failed to install platform-tools|HTTP status server error|download has failed' /tmp/xita-sbf-build.log; then
              exit 1
            fi
            if [ "$attempt" -eq 4 ]; then
              exit 1
            fi
            sleep "$((attempt * 3))"
          done
      - name: Mollusk positive and adversarial BLS/CU tests
        working-directory: chains/solana/sbf-bench
        run: cargo test -p xita-bls-sbf-probe-tests --test xita_bls -- --nocapture
