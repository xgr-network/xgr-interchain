name: Native Interchain Contracts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forge-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Install forge-std
        run: forge install foundry-rs/forge-std --no-commit
      - name: Install pinned Hyperlane and OpenZeppelin Solidity source
        run: npm install --prefix vendor --ignore-scripts --no-audit --no-fund
      - name: Verify actual deployed-contract import closure and production build
        run: |
          node services/admin/verify-solidity-runtime.mjs .
          forge build --force --skip test script
          node services/admin/seal-build-cli.mjs . "$(forge --version)" "$(git rev-parse HEAD)"
          node --input-type=module -e 'import {readSealedArtifacts} from "./services/admin/sealed-artifacts.mjs"; import {execFileSync} from "node:child_process"; const sha=execFileSync("git",["rev-parse","HEAD"],{encoding:"utf8"}).trim(); if(Object.keys(readSealedArtifacts(".",sha).raws).length!==10)process.exit(1);'
      - name: Contract tests
        run: forge test -vvv
