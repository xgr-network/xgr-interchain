name: Native Interchain Contracts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forge-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Install forge-std
        run: forge install foundry-rs/forge-std --no-commit
      - name: Install pinned Hyperlane and OpenZeppelin Solidity source
        run: npm install --prefix vendor --ignore-scripts --no-audit --no-fund
      - name: Contract tests
        run: forge test -vvv
